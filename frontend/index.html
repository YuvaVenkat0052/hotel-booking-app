<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking</title>
</head>
<body>
    <h1>Hotel Booking System</h1>

    <h2>Search Hotels</h2>

    <form>
        <label>Location:</label>
        <input type="text" placeholder="Enter city">

        <br><br>

        <label>Check-in:</label>
        <input type="date">

        <br><br>

        <label>Check-out:</label>
        <input type="date">

        <br><br>

        <button type="submit">Search Hotels</button>
    </form>
</body>
</html>
